# The Java artifact of the TRDC fork: libpolar.so for Linux x86_64 and aarch64, each built and
# tested on a runner of its own architecture, and one jar with both. A tag trdc-v<version>
# attaches the jar, its POM, and the sources jar to a GitHub release. See trdc/README.md.
name: trdc java

on:
  push:
    branches: ["trdc/**"]
    tags: ["trdc-v*"]
  pull_request:
    branches: ["trdc/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: native ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Runner architecture
        run: test "$(uname -m)" = "${{ matrix.arch }}"
      - name: Rust tests
        run: trdc/linux-lib.sh test ${{ matrix.arch }}
      - name: Build libpolar.so
        run: trdc/linux-lib.sh build ${{ matrix.arch }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libpolar-${{ matrix.arch }}
          path: languages/java/oso/src/main/resources/linux/${{ matrix.arch }}/libpolar.so
          if-no-files-found: error

  jar:
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: libpolar-x86_64
          path: languages/java/oso/src/main/resources/linux/x86_64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: libpolar-aarch64
          path: languages/java/oso/src/main/resources/linux/aarch64
      - name: macOS and Windows libraries of the upstream release
        run: trdc/fetch-upstream-libs.sh
      - name: Package
        run: trdc/java.sh x86_64 mvn -B -ntp -f languages/java/oso package
      - name: Check the jar
        run: |
          version=$(sed -n 's/.*<!-- oso_version --><version>\(.*\)<\/version>.*/\1/p' languages/java/oso/pom.xml)
          mkdir dist
          cp languages/java/oso/target/oso-$version.jar dist/
          cp languages/java/oso/target/oso-$version-sources.jar dist/
          cp languages/java/oso/dependency-reduced-pom.xml dist/oso-$version.pom
          trdc/check-jar.sh dist/oso-$version.jar
          (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oso-jar
          path: dist/
          if-no-files-found: error

  java:
    name: java 25 ${{ matrix.arch }}
    needs: jar
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Runner architecture
        run: test "$(uname -m)" = "${{ matrix.arch }}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: libpolar-${{ matrix.arch }}
          path: languages/java/oso/src/main/resources/linux/${{ matrix.arch }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: oso-jar
          path: dist
      - name: Java binding tests
        run: trdc/java.sh ${{ matrix.arch }} mvn -B -ntp -f languages/java/oso test
      - name: Smoke test of the packaged jar
        run: |
          trdc/java.sh ${{ matrix.arch }} sh -c \
            'java --enable-native-access=ALL-UNNAMED -cp dist/oso-*[0-9].jar trdc/smoke/Smoke.java smoke-${{ matrix.arch }}.txt'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-${{ matrix.arch }}
          path: smoke-${{ matrix.arch }}.txt
          if-no-files-found: error

  compare:
    needs: java
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: smoke-*
          merge-multiple: true
      - name: Same decisions on both architectures
        run: |
          sha256sum smoke-*.txt
          cmp smoke-x86_64.txt smoke-aarch64.txt

  release:
    if: startsWith(github.ref, 'refs/tags/trdc-v')
    needs: [jar, compare]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: oso-jar
          path: dist
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "oso ${GITHUB_REF_NAME#trdc-v} for TRDC: upstream v0.27.3 with libpolar.so for Linux x86_64 and aarch64. Commit $GITHUB_SHA."
